name: CI/CD

# AWS Elastic Beanstalk 배포용 워크플로다. 서버를 Oracle Cloud로 옮긴 뒤(2026-01)에는 서버에서 직접 빌드·배포하므로 쓰지 않는다.
# 커밋 메시지에 [BE]가 들어가도 자동으로 돌지 않도록 push 트리거를 막고, 수동 실행(workflow_dispatch)만 남겼다(2026-11).
# 이전 트리거:
# on:
#   push:
#     branches: [ main ]
on:
  workflow_dispatch:

jobs:
  build:
    if: ${{ contains(github.event.head_commit.message, '[BE]') }} # 커밋 메시지에 [BE]가 포함된 경우에만 실행
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-java@v3
      with:
        distribution: 'corretto'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: back-end

    - name: Build with Gradle
      run: ./gradlew clean build
      working-directory: back-end

    - name: Get current time
      uses: josStorer/get-current-time@v2.0.2
      id: current-time
      with:
        format: YYYY-MM-DDTHH-mm-ss
        utcOffset: "+09:00"

    - name: Set artifact
      run: echo "artifact=$(ls ./build/libs)" >> $GITHUB_ENV
      working-directory: back-end

    - name: Beanstalk Deploy
      uses: einaregilsson/beanstalk-deploy@v20
      with:
        aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        application_name: moaloa-springboot
        environment_name: MOALOA-springboot-env
        version_label: github-action-${{steps.current-time.outputs.formattedTime}}
        region: ap-northeast-2
        deployment_package: ./back-end/build/libs/${{env.artifact}}